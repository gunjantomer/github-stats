name: Generate Contribution Snake

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            generated/github-contribution-grid-snake.svg
            generated/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake output to repository
        run: |
          git config --global user.name "github-stats[bot]"
          git config --global user.email "github-stats[bot]@users.noreply.github.com"
          git add generated/github-contribution-grid-snake.svg generated/github-contribution-grid-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update contribution snake"
            # The stats workflow may push to main between our checkout and
            # push. Rebase onto the latest main and retry so a non-fast-forward
            # rejection does not fail the run.
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                break
              fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort; echo 'Rebase failed'; exit 1; }
            done
          fi
