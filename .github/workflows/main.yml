name: Generate Stats Images

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Check out repository under $GITHUB_WORKSPACE, so the job can access it.
    # Full history so the commit step can rebase onto a main that another
    # workflow (e.g. the snake job) may have advanced in the meantime.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Run using Python 3.11 for consistency and aiohttp
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'
        cache: 'pip'

    # Install dependencies with `pip`
    - name: Install requirements
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install -r requirements.txt

    # Generate all statistics images
    - name: Generate images
      run: |
        python3 --version
        python3 generate_images.py
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EXCLUDED: ${{ secrets.EXCLUDED }}
        EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
        EXCLUDE_FORKED_REPOS: true

    # Commit all changed generated files to the repository. If generation
    # failed (e.g. expired token) the job stops before this step, so the last
    # good images are preserved rather than overwritten with zeros.
    - name: Commit to the repo
      run: |
        git config --global user.name "github-stats[bot]"
        git config --global user.email "github-stats[bot]@users.noreply.github.com"
        git add generated
        if ! git diff --cached --quiet; then
          git commit -m 'Update generated files'
          # The snake workflow (or another run) may push to main between our
          # checkout and push. Rebase onto the latest main and retry so a
          # non-fast-forward rejection does not fail the run.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo 'Rebase failed'; exit 1; }
          done
        else
          echo 'No changes to generated files'
        fi
