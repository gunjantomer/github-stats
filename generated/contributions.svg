<svg id="gh-dark-mode-only" width="640" height="164" xmlns="http://www.w3.org/2000/svg">
<style>
svg { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; }
#background { fill: white; stroke: rgb(225, 228, 232); stroke-width: 1px; }
#gh-dark-mode-only:target #background { fill: #0d1117; stroke-width: 0.5px; }
.title { font-size: 14px; font-weight: 600; fill: rgb(3, 102, 214); }
#gh-dark-mode-only:target .title { fill: #58a6ff; }
.body { font-size: 12px; fill: rgb(88, 96, 105); }
#gh-dark-mode-only:target .body { fill: #8b949e; }
</style>
<g>
<rect x="5" y="5" width="630" height="154" rx="6" ry="6" id="background" />
<text x="18" y="22" class="title">Contribution Activity</text>
<text x="18" y="86" class="body">Stats are generated by GitHub Actions.</text>
<text x="18" y="108" class="body">Add a valid ACCESS_TOKEN secret and run the workflow to populate this card.</text>
</g>
</svg>
