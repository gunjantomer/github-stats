<svg id="gh-dark-mode-only" width="360" height="210" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
}

#background {
  fill: white;
  stroke: rgb(225, 228, 232);
  stroke-width: 1px;
}

#gh-dark-mode-only:target #background {
  fill: #0d1117;
  stroke-width: 0.5px;
}

.title {
  font-size: 14px;
  font-weight: 600;
  fill: rgb(3, 102, 214);
}

#gh-dark-mode-only:target .title {
  fill: #58a6ff;
}

.metric {
  font-size: 22px;
  font-weight: 700;
}

.added {
  fill: #2da44e;
}

#gh-dark-mode-only:target .added {
  fill: #3fb950;
}

.removed {
  fill: #cf222e;
}

#gh-dark-mode-only:target .removed {
  fill: #f85149;
}

.views {
  fill: #f0803c;
}

.label {
  font-size: 12px;
  fill: rgb(88, 96, 105);
}

#gh-dark-mode-only:target .label {
  fill: #8b949e;
}
</style>
<g>
<rect x="5" y="5" width="350" height="200" rx="6" ry="6" id="background" />
<text x="21" y="34" class="title">Code &amp; Traffic</text>
<text x="21" y="82" class="metric added">+{{ added }}</text>
<text x="21" y="100" class="label">lines added</text>
<text x="21" y="140" class="metric removed">-{{ removed }}</text>
<text x="21" y="158" class="label">lines removed</text>
<text x="21" y="188" class="metric views">{{ views }}</text>
<text x="150" y="188" class="label">views (last 14 days)</text>
</g>
</svg>
